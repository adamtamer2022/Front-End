<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساحة التحديات — كورس Front-End | آدم تامر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
:root{--p:#6C4CF5;--t:#00B39C;--d:#F7F5FF;--ink:#1E1B4B;--card:rgba(255,255,255,.85);--line:#E7E3F8;--ok:#22C55E;--bad:#FF4D6D;--gold:#FFC93C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,Tahoma,sans-serif;min-height:100vh;color:var(--ink);background:var(--d);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.6;animation:blob 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:#C4B5FD;top:-140px;right:-120px}
.bg i:nth-child(2){width:460px;height:460px;background:#99F6E4;bottom:-160px;left:-100px;animation-delay:-6s}
.bg i:nth-child(3){width:340px;height:340px;background:#FBCFE8;top:40%;left:45%;opacity:.5;animation-delay:-12s}
@keyframes blob{to{transform:translate(60px,40px) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(108,76,245,.18) 1px,transparent 1px);background-size:44px 44px;opacity:.25}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:18px 18px 50px}
nav{display:flex;align-items:center;gap:12px;margin-bottom:22px}
nav svg{width:46px;height:46px}
nav .t{font-weight:900;font-size:19px;line-height:1.15}nav .t small{display:block;font-weight:600;color:#6C4CF5;font-size:13px}
nav .sp{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-weight:700;display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:18px;cursor:pointer}
.scr{display:none;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}.scr.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.glass{background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(14px);box-shadow:0 16px 40px rgba(30,27,75,.08)}
/* login */
.login{max-width:560px;margin:30px auto;padding:34px 28px;text-align:center}
.login svg{width:120px;height:120px;filter:drop-shadow(0 14px 30px rgba(108,76,245,.35));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(-3deg)}}
.login h1{font-size:clamp(28px,6vw,42px);font-weight:900;margin:14px 0 2px;background:linear-gradient(90deg,#6C4CF5,#00B39C);-webkit-background-clip:text;color:transparent}
.login p{color:#6B7280}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:22px 0 14px}
.av button{font-size:30px;background:#F3F0FF;border:2px solid transparent;border-radius:16px;padding:8px 0;cursor:pointer;transition:.2s}
.av button:hover{transform:translateY(-3px)}.av button.on{border-color:var(--t);background:#CCFBF1;transform:scale(1.08)}
.in{width:100%;padding:15px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:Cairo;font-size:19px;text-align:center;outline:0;transition:.2s}
.in:focus{border-color:var(--p);box-shadow:0 0 0 5px rgba(124,92,255,.2)}
.btn{background:linear-gradient(135deg,var(--p),var(--t));color:#fff;border:0;border-radius:18px;padding:14px 40px;font-family:Cairo;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 12px 34px rgba(124,92,255,.45);transition:.2s;margin-top:16px}
.btn:hover{transform:translateY(-3px)}.btn.ghost{background:#fff;color:var(--ink);box-shadow:none;font-size:17px;padding:11px 24px;border:1px solid var(--line)}
/* home */
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:22px 24px;margin-bottom:22px}
@media(max-width:700px){.prof{grid-template-columns:auto 1fr}.prof .kp{grid-column:1/-1}}
.big-av{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#EDE9FE,#CCFBF1);box-shadow:inset 0 0 0 2px #fff}
.prof h2{font-size:26px;font-weight:900}
.lvl{display:inline-flex;gap:6px;align-items:center;background:#FEF3C7;color:#B45309;border-radius:20px;padding:2px 12px;font-weight:900;font-size:14px;margin-inline-start:6px;vertical-align:middle}
.xp{height:12px;background:#EDE9FE;border-radius:10px;overflow:hidden;margin-top:10px}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff8a3c);border-radius:10px;transition:1s}
.xpt{font-size:13px;color:#6B7280;margin-top:4px}
.kp{display:flex;gap:10px}
.kp div{background:#F7F5FF;border-radius:18px;padding:10px 16px;text-align:center;min-width:86px}.kp b{display:block;font-size:24px}.kp small{color:#6B7280}
.wk{margin:24px 0 10px;font-weight:900;color:#6C4CF5;display:flex;align-items:center;gap:10px}.wk::after{content:"";flex:1;height:1px;background:var(--line)}
#lects{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:4px 26px}@media(max-width:520px){#lects{grid-template-columns:1fr}}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:420px){.lgrid{grid-template-columns:1fr}}
.lc{position:relative;padding:18px;border-radius:24px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.25s;overflow:hidden;text-align:start;color:var(--ink);font-family:Cairo}
.lc:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.7);box-shadow:0 18px 40px rgba(108,76,245,.18)}
.lc::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(108,76,245,.07),transparent 60%);opacity:1}
.lc>*{position:relative}
.lc .n{font-family:'Fira Code';font-size:34px;font-weight:700;opacity:.12;position:absolute;left:16px;top:8px;color:#6C4CF5}
.lc .tag{font-size:12px;font-weight:900;padding:2px 10px;border-radius:12px;background:#CCFBF1;color:#0F766E;display:inline-block}
.lc h3{font-size:18px;font-weight:900;margin:8px 0 2px;line-height:1.5;min-height:54px}
.lc .en{font-family:'Fira Code';font-size:12px;color:#6C4CF5}
.lc .st{margin-top:10px;font-size:18px;letter-spacing:2px}.lc .st .off{filter:grayscale(1) opacity(.25)}
.lc .bs{font-size:13px;color:#6B7280;margin-top:2px}
.lc.lock{cursor:not-allowed;opacity:.45}.lc.lock:hover{transform:none;box-shadow:none;border-color:var(--line)}
.lc.lock::after{content:"🔒";position:absolute;left:16px;bottom:14px;font-size:22px}
.lc.new{border-color:rgba(0,209,178,.6)}.lc.new .tag{background:var(--t);color:#fff}
/* play */
.hud{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.stg{color:#fff;background:linear-gradient(135deg,var(--p),#5b3bf5);border-radius:14px;padding:6px 16px;font-weight:900}
.prog{flex:1;height:12px;background:#EDE9FE;border-radius:10px;overflow:hidden;min-width:140px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--p));transition:.4s}
.timer{height:8px;background:#EDE9FE;border-radius:8px;overflow:hidden;margin:4px 0 18px}
.timer i{display:block;height:100%;background:var(--gold);transition:width .1s linear}.timer i.low{background:var(--bad)}
.qcard{padding:28px 24px}
.qtext{font-size:clamp(20px,3.4vw,28px);font-weight:900;line-height:1.7;text-align:center;margin-bottom:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:20px;padding:16px;font-family:Cairo;font-size:19px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px;text-align:start}
.opt:hover{background:#F3F0FF;transform:translateY(-2px)}
.opt .k{background:#EDE9FE;color:var(--p);min-width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px}
.opt.ok .mono,.opt.bad .mono,.m.done .mono{background:rgba(255,255,255,.25);color:#fff}.opt.ok .k,.opt.bad .k{background:rgba(255,255,255,.25);color:#fff}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:yes .4s}.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:no .4s}
@keyframes yes{50%{transform:scale(1.05)}}@keyframes no{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.mono{font-family:'Fira Code',Consolas,monospace;direction:ltr;unicode-bidi:embed;background:#EDE9FE;color:#5B3BE0;padding:0 7px;border-radius:7px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tf .opt{justify-content:center;font-size:28px;padding:28px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.m{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;text-align:center;transition:.15s;color:var(--ink);font-family:Cairo}
.m.term{font-family:'Fira Code',Cairo,monospace;direction:ltr}
.m.sel{border-color:var(--gold);background:#FEF3C7;transform:scale(1.03)}
.m.done{color:#fff;background:var(--ok);border-color:var(--ok);opacity:.5;pointer-events:none}.m.bad{color:#fff;background:var(--bad);animation:no .4s}
.float{position:fixed;font-weight:900;font-size:30px;pointer-events:none;z-index:50;animation:up 1s forwards;text-shadow:0 2px 8px rgba(0,0,0,.15)}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.intro{text-align:center;padding:60px 10px}.intro .e{font-size:90px;animation:fl 2s ease-in-out infinite}.intro h2{font-size:36px;font-weight:900}.intro p{color:#6B7280;font-size:19px}
/* result */
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}@media(max-width:820px){.res{grid-template-columns:1fr}}
.rbox{padding:26px;text-align:center}
.stars{font-size:62px;letter-spacing:6px}.stars span{display:inline-block;filter:grayscale(1) opacity(.25)}.stars span.on{filter:none;animation:sp .6s backwards}
@keyframes sp{from{transform:scale(0) rotate(-90deg)}}
.sc{font-size:66px;font-weight:900;background:linear-gradient(90deg,#F59E0B,#6C4CF5);-webkit-background-clip:text;color:transparent;line-height:1.1}
.grade{font-size:23px;font-weight:900;margin:8px 0}
.xpg{display:inline-block;background:#FEF3C7;color:#B45309;border-radius:20px;padding:4px 16px;font-weight:900;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stats div{background:#F7F5FF;border-radius:16px;padding:10px}.stats b{display:block;font-size:24px}
.lb{padding:22px}.lb h3{margin-bottom:12px;font-size:20px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;margin-bottom:6px;background:#F7F5FF}
.row .r{width:30px;font-weight:900;text-align:center}.row .a{font-size:24px}.row .nm{flex:1;font-weight:700}.row .p{font-family:'Fira Code';color:#B45309;font-weight:700}
.row.me{background:#EDE9FE;border:1px solid var(--p)}
.review{padding:20px;margin-top:18px}.review p{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.8}.review b{color:#0F766E}
.sync{font-size:13px;color:#6B7280;margin-top:8px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.foot{text-align:center;color:#9CA3AF;margin-top:30px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#1E1B4B;color:#fff;border:1px solid var(--line);padding:12px 22px;border-radius:16px;z-index:70;transition:.4s;font-weight:700}
.toast.on{transform:translateX(-50%)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div><div class="grain"></div>
<canvas id="cf"></canvas>
<div class="wrap">
<nav><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" >
 <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C4CF5"/><stop offset="1" stop-color="#00C2A8"/></linearGradient></defs>
 <rect x="20" y="20" width="360" height="360" rx="90" fill="url(#g)"/>
 <rect x="44" y="44" width="312" height="312" rx="70" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
 <text x="200" y="205" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="bold" font-size="120" fill="#fff">&lt;/&gt;</text>
 <text x="200" y="300" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="62" fill="#fff">آدم تامر</text>
</svg>
<div class="t">ساحة التحديات<small>كورس Front-End من الصفر</small></div><div class="sp"></div>
 <div class="chip" id="navUser" style="display:none"></div>
 <button class="ib" id="mute" title="الصوت">🔊</button>
 <button class="ib" id="logout" title="تغيير الاسم" style="display:none">⎋</button></nav>

<section class="scr on" id="s-login"><div class="glass login"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" >
 <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C4CF5"/><stop offset="1" stop-color="#00C2A8"/></linearGradient></defs>
 <rect x="20" y="20" width="360" height="360" rx="90" fill="url(#g)"/>
 <rect x="44" y="44" width="312" height="312" rx="70" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
 <text x="200" y="205" text-anchor="middle" font-family="DejaVu Sans Mono" font-weight="bold" font-size="120" fill="#fff">&lt;/&gt;</text>
 <text x="200" y="300" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="62" fill="#fff">آدم تامر</text>
</svg>

 <h1>ساحة التحديات 🚀</h1><p>العب، اجمع النجوم، وارتقِ في المستويات</p>
 <div class="av" id="avs"></div>
 <input class="in" id="name" placeholder="اكتب اسمك الثلاثي" maxlength="40">
 <button class="btn" id="enter">ادخل الساحة ▶</button>
 <p style="font-size:13px;margin-top:14px;opacity:.7">اكتب اسمك نفسه كل مرة علشان المدرب يتابع مستواك 💜</p></div></section>

<section class="scr" id="s-home">
 <div class="glass prof"><div class="big-av" id="pAv"></div>
  <div><h2><span id="pName"></span><span class="lvl" id="pLvl"></span></h2><div class="xp"><i id="xpBar"></i></div><div class="xpt" id="xpTxt"></div></div>
  <div class="kp"><div><b id="kS">0</b><small>⭐ نجوم</small></div><div><b id="kD">0</b><small>✅ محاضرات</small></div><div><b id="kX">0</b><small>⚡ XP</small></div></div></div>
 <div id="lects"></div></section>

<section class="scr" id="s-intro"><div class="intro"><div class="e" id="iE"></div><h2 id="iT"></h2><p id="iP"></p></div></section>

<section class="scr" id="s-play">
 <div class="hud"><span class="stg" id="stg"></span><div class="prog"><i id="prog"></i></div><span class="chip" id="combo">🔥 x1</span><span class="chip">⭐ <b id="score">0</b></span></div>
 <div class="timer"><i id="tbar"></i></div>
 <div class="glass qcard" id="qcard"></div></section>

<section class="scr" id="s-res">
 <div class="res"><div class="glass rbox">
  <div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div class="grade" id="grade"></div><div class="sc" id="final">0</div><div>نقطة</div><div class="xpg" id="xpGain"></div>
  <div class="stats"><div><b id="rC">0</b>صحيحة</div><div><b id="rW">0</b>أخطاء</div><div><b id="rB">0</b>🔥 سلسلة</div></div>
  <button class="btn" id="again">العب مرة أخرى ↺</button> <button class="btn ghost" id="home">🏠 الساحة</button>
  <div class="sync" id="sync"></div></div>
  <div class="glass lb"><h3>🏆 أوائل هذه المحاضرة</h3><div id="lb"><p style="opacity:.6">جارٍ التحميل…</p></div></div></div>
 <div class="glass review" id="review"></div></section>
<div class="foot">إعداد آدم تامر © 2026 — كورس Front-End من الصفر</div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
const CFG=window.SITE_CONFIG||{};
const API=CFG.api||"";            // رابط Google Apps Script

  show("s-play");$("#prog").style.width=(i/qs.length*100)+"%";const q=qs[i],order=shuf(q.o.map((t,k)=>({t,k})));let lock=false;
  $("#qcard").innerHTML=`<div class="qtext">${fmt(q.q)}</div><div class="opts">${order.map((o,j)=>`<button class="opt" data-k="${o.k}"><span class="k">${"أبجد"[j]}</span><span>${fmt(o.t)}</span></button>`).join("")}</div>`;
  const reveal=()=>document.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.k===q.a)b.classList.add("ok");});
  const left=timer(20,()=>{if(lock)return;lock=true;miss({q:q.q,a:q.o[q.a]});reveal();setTimeout(()=>{i++;next()},1300);});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;clearInterval(tmr);
   if(+b.dataset.k===q.a){hit();add(Math.round((100+left()*5)*combo),b);}else{b.classList.add("bad");miss({q:q.q,a:q.o[q.a]});}reveal();setTimeout(()=>{i++;next()},1100);});};next();}
function stage2(){const qs=shuf(LEC.tf);let i=0;$("#stg").textContent="✅ المرحلة 2 من 3";
 const next=()=>{if(i>=qs.length)return intro("🔗","المرحلة 3: وصّل المصطلح","اضغط المصطلح ثم معناه",stage3);
  show("s-play");$("#prog").style.width=(i/qs.length*100)+"%";const q=qs[i];let lock=false;
  $("#qcard").innerHTML=`<div class="qtext">${fmt(q.s)}</div><div class="tf"><button class="opt" data-v="1">✔️ صح</button><button class="opt" data-v="0">❌ خطأ</button></div>`;
  const ans=()=>document.querySelector(`.opt[data-v="${q.v?1:0}"]`).classList.add("ok");
  const left=timer(12,()=>{if(lock)return;lock=true;miss({q:q.s,a:q.v?"صح":"خطأ"});ans();setTimeout(()=>{i++;next()},1200);});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;clearInterval(tmr);
   if((b.dataset.v==="1")===q.v){hit();add(Math.round((80+left()*6)*combo),b);}else{b.classList.add("bad");miss({q:q.s,a:q.v?"صح":"خطأ"});}ans();setTimeout(()=>{i++;next()},1000);});};next();}
function stage3(){show("s-play");$("#stg").textContent="🔗 المرحلة 3 من 3";$("#prog").style.width="0%";const pairs=LEC.match;let sel=null,done=0;
 $("#qcard").innerHTML=`<div class="qtext">وصّل كل مصطلح بمعناه 🔗</div><div class="match"><div class="col">${shuf(pairs.map((p,k)=>({p,k}))).map(o=>`<button class="m term" data-k="${o.k}">${esc(o.p[0])}</button>`).join("")}</div><div class="col">${shuf(pairs.map((p,k)=>({p,k}))).map(o=>`<button class="m def" data-k="${o.k}">${esc(o.p[1])}</button>`).join("")}</div></div>`;
 const left=timer(60,finish);
 document.querySelectorAll(".m").forEach(b=>b.onclick=()=>{
  if(!sel||sel.classList.contains(b.classList.contains("term")?"term":"def")){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");sfx.click();return;}
  const a=sel;sel=null;a.classList.remove("sel");
  if(a.dataset.k===b.dataset.k){a.classList.add("done");b.classList.add("done");hit();add(Math.round(120*combo),b);done++;$("#prog").style.width=(done/pairs.length*100)+"%";if(done===pairs.length){clearInterval(tmr);add(Math.round(left()*10),b);setTimeout(finish,700);}}
  else{[a,b].forEach(x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),450);});miss();add(-30,b);}});
 let ended=false;function finish(){if(ended)return;ended=true;clearInterval(tmr);pairs.forEach((p,k)=>{if(!document.querySelector(`.term[data-k="${k}"]`).classList.contains("done"))mistakes.push({q:"معنى "+p[0],a:p[1]});});results();}}
function results(){show("s-res");const total=LEC.mcq.length+LEC.tf.length+LEC.match.length,pct=Math.round(correct/total*100),st=pct>=90?3:pct>=65?2:pct>=35?1:0;
 score=Math.max(0,score);
 document.querySelectorAll("#stars span").forEach((s,i)=>{s.classList.toggle("on",i<st);s.style.animationDelay=(i*.25)+"s";});
 const first=me.name.split(" ")[0];$("#grade").textContent=[`حاول مرة أخرى يا ${first} 💪`,`بداية جيدة يا ${first} 👍`,`رائع يا ${first}! 🌟`,`أسطورة يا ${first}! 🏆`][st];
 let n=0;const iv=setInterval(()=>{n=Math.min(score,n+Math.max(1,Math.ceil(score/40)));$("#final").textContent=n;if(n>=score)clearInterval(iv);},30);
 $("#rC").textContent=correct;$("#rW").textContent=wrong;$("#rB").textContent=best;
 // XP: أول مرة كامل، وبعد كده الزيادة فوق أفضل نتيجة فقط
 const p=progress(),v=p[LEC.n]||{best:0,stars:0,tries:0,xp:0};const newXp=Math.round(Math.max(v.best,score)/10);const gain=newXp-(v.xp||0)+5;
 const oldLvl=level(totals().xp).name;
 p[LEC.n]={best:Math.max(v.best,score),stars:Math.max(v.stars,st),tries:v.tries+1,xp:(v.xp||0)+gain,pct:Math.max(v.pct||0,pct)};LS.set(progKey(),p);
 $("#xpGain").textContent=`+${gain} XP`+(score>v.best&&v.tries?"  •  رقم قياسي جديد! 🎉":"");
 const nl=level(totals().xp).name;if(nl!==oldLvl)setTimeout(()=>toast(`🎉 مبروك! وصلت لمستوى «${nl}»`),1200);
 $("#review").innerHTML=mistakes.length?`<h3>📚 راجع هذه النقاط:</h3>`+mistakes.map(m=>`<p>${fmt(m.q)}<br>الإجابة الصحيحة: <b>${fmt(m.a)}</b></p>`).join(""):`<h3>🎯 لا أخطاء! أداء مثالي</h3>`;
 $("#sync").textContent=ONLINE?"⏳ جارٍ إرسال نتيجتك…":"";
 send({name:me.name,avatar:me.avatar,lecture:LEC.n,score,correct,wrong,total,pct,stars:st,seconds:Math.round((Date.now()-t0)/1000),mistakes:mistakes.map(m=>m.q).slice(0,20)});
 sfx.win();if(st>=2)confetti();board();}
function board(){const el=$("#lb");if(!ONLINE){el.innerHTML=`<p style="opacity:.7">الترتيب يظهر عندما يربط المدرب الساحة بالإنترنت.</p>`;return;}
 el.innerHTML=`<p style="opacity:.6">جارٍ التحميل…</p>`;
 setTimeout(()=>jsonp({action:"top",lecture:LEC.n}).then(d=>{const top=(d.top||[]);if(!top.length){el.innerHTML="<p>كن أول من يدخل الترتيب! 🥇</p>";return;}
  el.innerHTML=top.map((r,i)=>`<div class="row ${r.name===me.name?"me":""}"><span class="r">${["🥇","🥈","🥉"][i]||i+1}</span><span class="a">${esc(r.avatar||"🙂")}</span><span class="nm">${esc(r.name)}</span><span>${"⭐".repeat(r.stars||0)}</span><span class="p">${r.score}</span></div>`).join("");})
  .catch(()=>el.innerHTML="<p style='opacity:.7'>تعذّر تحميل الترتيب الآن.</p>"),2500);}
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#6C4CF5","#00B39C","#FFC93C","#FF4D6D","#60A5FA"];
 const ps=Array.from({length:170},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.random()*5|0],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});if(++f<240)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();}
$("#again").onclick=()=>play(LEC.n);$("#home").onclick=home;
// فتح محاضرة مباشرة: ?l=5
if(me){home();const q=+new URLSearchParams(location.search).get("l");if(q&&q<=OPEN)play(q);}
</script>
